name: Backend CI

on:
  pull_request:
    branches: [main, 'us*']
  push:
    branches: [main, 'us*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  tests:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Ratio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Ratio/**/packages.lock.json
      - name: Restore locked dependencies
        run: dotnet restore Ratio.slnx --locked-mode
      - name: Check formatting and analyzers
        run: dotnet format Ratio.slnx --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build Ratio.slnx --configuration Release --no-restore
      - name: Run tests with disposable PostgreSQL
        run: dotnet test Ratio.slnx --configuration Release --no-build --no-restore --logger trx --collect:"XPlat Code Coverage" --results-directory ../TestResults
      - name: Publish self-contained Windows API
        run: dotnet publish Ratio.Api/Ratio.Api.csproj --configuration Release --runtime win-x64 --self-contained true -p:RestoreLockedMode=true --output ../artifacts/api
      - name: Upload test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results-${{ github.sha }}
          path: TestResults/
          retention-days: 14
      - name: Upload validated API
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ratio-api-win-x64-${{ github.sha }}
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 30
