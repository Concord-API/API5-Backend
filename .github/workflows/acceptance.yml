name: Acceptance

on:
  push:
    branches: ['us*']
  pull_request:
    branches: ['us*']
    paths:
      - .github/workflows/acceptance.yml
      - acceptance/**

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  POSTGRES_VERSION: 16.15
  PGHOST: localhost
  PGPORT: '5433'
  PGDATABASE: ratio
  PGUSER: ratio
  PGPASSWORD: ratio
  PGCLIENTENCODING: UTF8
  SITE_PATH: C:\inetpub\ratio

defaults:
  run:
    shell: pwsh

jobs:
  acceptance:
    name: Acceptance
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Pick the frontend branch
        id: other
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git ls-remote --exit-code --heads https://github.com/Concord-API/API5-Frontend.git $env:BRANCH | Out-Null
          $ref = if ($LASTEXITCODE -eq 0) { $env:BRANCH } else { 'main' }
          "ref=$ref" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: backend

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Concord-API/API5-Frontend
          ref: ${{ steps.other.outputs.ref }}
          path: frontend

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/Ratio/**/packages.lock.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/ratio/.node-version
          cache: npm
          cache-dependency-path: frontend/ratio/package-lock.json

      - name: Install PostgreSQL for Windows
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'postgresql.zip'
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$env:POSTGRES_VERSION-1-windows-x64-binaries.zip" -OutFile $zip
          tar -xf $zip -C $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'pgsql\bin'
          $bin >> $env:GITHUB_PATH
          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          $password = Join-Path $env:RUNNER_TEMP 'pgpass.txt'
          Set-Content -Path $password -Value $env:PGPASSWORD -NoNewline
          & "$bin\initdb.exe" -D $data -U $env:PGUSER --pwfile=$password -A scram-sha-256 --encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR --locale=C
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$bin\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'postgres.log') -o "-p $env:PGPORT" -w start
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$bin\createdb.exe" $env:PGDATABASE
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$bin\psql.exe" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install IIS with URL Rewrite and the reverse proxy
        run: |
          Install-WindowsFeature Web-Server -IncludeManagementTools | Out-Null
          $modules = [ordered]@{
            rewrite = 'https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_en-US.msi'
            arr = 'https://download.microsoft.com/download/E/9/8/E9849D6A-020E-47E4-9FD0-A023E99B54EB/requestRouter_amd64.msi'
          }
          foreach ($module in $modules.GetEnumerator()) {
            $msi = Join-Path $env:RUNNER_TEMP "$($module.Key).msi"
            Invoke-WebRequest $module.Value -OutFile $msi
            $install = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "$($module.Key) failed with $($install.ExitCode)" }
          }
          & "$env:windir\System32\inetsrv\appcmd.exe" set config -section:system.webServer/proxy /enabled:"True" /commit:apphost
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish the API as it ships to the client
        run: dotnet publish backend/Ratio/Ratio.Api/Ratio.Api.csproj --configuration Release --runtime win-x64 --self-contained true -p:RestoreLockedMode=true --output "$env:RUNNER_TEMP\api"

      - name: Start the API as a Windows service on an empty database
        run: |
          $api = Join-Path $env:RUNNER_TEMP 'api'
          @{ ConnectionStrings = @{ Ratio = "Host=$env:PGHOST;Port=$env:PGPORT;Database=$env:PGDATABASE;Username=$env:PGUSER;Password=$env:PGPASSWORD" } } |
            ConvertTo-Json | Set-Content -Path "$api\appsettings.Production.json" -Encoding utf8
          New-Service -Name Ratio -BinaryPathName "`"$api\Ratio.Api.exe`"" -StartupType Manual | Out-Null
          Start-Service -Name Ratio
          foreach ($attempt in 1..60) {
            try {
              Invoke-WebRequest http://127.0.0.1:5000/health -UseBasicParsing | Out-Null
              exit 0
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          Write-Output "::error::The API did not answer /health"
          exit 1

      - name: Check that the API created the schema and reports no load
        run: |
          $applied = [int](psql -tAc "SELECT count(*) FROM migrations.schema_versions")
          Write-Output "Migrations applied: $applied"
          if ($applied -le 0) { exit 1 }
          $ready = Invoke-WebRequest http://127.0.0.1:5000/health/ready -SkipHttpErrorCheck -UseBasicParsing
          $body = [System.Text.Encoding]::UTF8.GetString($ready.RawContentStream.ToArray())
          Write-Output "$($ready.StatusCode) $body"
          if ($ready.StatusCode -ne 503) { exit 1 }
          if (($body | ConvertFrom-Json).reason -ne 'sem carga publicada') { exit 1 }

      - name: Load the sample
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/acceptance/sample-load.sql
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check that the API reports the load
        run: |
          $ready = Invoke-RestMethod http://127.0.0.1:5000/health/ready
          $ready | ConvertTo-Json
          if ($ready.status -ne 'Pronto') { exit 1 }

      - name: Build the frontend
        working-directory: frontend/ratio
        run: |
          npm install --global npm@11.12.1
          npm ci
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Serve the frontend from IIS
        run: |
          New-Item -ItemType Directory -Path $env:SITE_PATH -Force | Out-Null
          Copy-Item -Path frontend/ratio/apps/web/dist/* -Destination $env:SITE_PATH -Recurse -Force
          if (-not (Test-Path "$env:SITE_PATH\web.config")) { throw 'The build has no web.config' }
          & "$env:windir\System32\inetsrv\appcmd.exe" add site /name:Ratio /physicalPath:$env:SITE_PATH /bindings:http/*:8080:
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the frontend and the API through IIS
        run: |
          foreach ($path in '/', '/tema/1') {
            $page = Invoke-WebRequest "http://127.0.0.1:8080$path" -UseBasicParsing
            if ($page.Content -notmatch '<div id="root">') { throw "$path did not return the app" }
            Write-Output "$path returned the app"
          }
          $search = Invoke-RestMethod 'http://127.0.0.1:8080/api/themes?q=cobranca%20de%20divida'
          Write-Output "Search returned $($search.themes.Count) theme(s)"
          if ($search.themes.Count -lt 1) { exit 1 }
          $theme = Invoke-RestMethod http://127.0.0.1:8080/api/themes/1
          Write-Output "Theme 1 is $($theme.name)"
          if (-not $theme.name) { exit 1 }
          $court = $theme.courtAlignments | Select-Object -First 1
          Write-Output "Court $($court.courtCode) has $($court.decisions) decision(s), the last on $($court.lastDecisionDate)"
          if (-not $court.lastDecisionDate) { exit 1 }
          $panels = Invoke-RestMethod http://127.0.0.1:8080/api/themes/1/panels
          Write-Output "Theme 1 has panels in $($panels.courts.Count) court(s)"
          if ($panels.themeKey -ne 1) { exit 1 }

      - name: Check the API responses against the frontend contract
        working-directory: frontend/ratio/apps/web
        env:
          CONTRACT_API_URL: http://127.0.0.1:8080
        run: |
          npm run test:contract
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          $logs = New-Item -ItemType Directory -Path acceptance-logs -Force
          foreach ($source in "$env:RUNNER_TEMP\api\logs", "$env:RUNNER_TEMP\postgres.log", 'C:\inetpub\logs\LogFiles') {
            if (Test-Path $source) { Copy-Item -Path $source -Destination $logs -Recurse -Force }
          }
          Get-Service -Name Ratio -ErrorAction SilentlyContinue | Format-List Name, Status
          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Ratio|\.NET Runtime|Application Error' } |
            Format-List TimeCreated, ProviderName, Message

      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-logs-${{ github.sha }}
          path: acceptance-logs/
          retention-days: 14
